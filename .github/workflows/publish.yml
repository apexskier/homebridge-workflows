name: Publish Package

on:
  workflow_call:

concurrency:
  group: ${{ github.repository_id }}-publish

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify version matches tag
        run: test "$(npm pkg get version)" = "\"${GITHUB_REF#refs/tags/v}\""
      - run: npm ci
      - run: npm i -g semver@6
      - name: Get tag
        id: get-tag
        run: echo "tag=$(node -e 'console.log(require("semver").parse(require("./package.json").version).prerelease.at(0) || "latest")')" >> $GITHUB_OUTPUT
      - run: npm publish --tag "${{ steps.get-tag.outputs.tag }}" # this runs prepare
